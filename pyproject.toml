[project]
name = "aec-rfi-agent"
version = "0.0.1"
description = "Revision-aware agent that drafts cited answers to construction RFIs"
requires-python = ">=3.11"
dependencies = [
  "langgraph",
  "langchain-core",
  "fastapi",
  "uvicorn",
  "pydantic>=2",
  "psycopg[binary]",
  "pgvector",
  "pymupdf",
  "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
